<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WRO LAP TIMER HYBRID PRO - UNIVERSAL FULLSCREEN</title>
  
  <!-- Google Fonts, SweetAlert2 & DotLottie Web Component -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js" type="module"></script>
  
  <style>
    :root {
      /* Modern Flat Palette */
      --bg-color: #ffffff;       
      --card-bg: #f8fafc;       
      --primary: #2563eb;       
      --primary-hover: #1d4ed8;
      --warning: #ea580c;       
      --warning-hover: #c2410c;
      --success: #16a34a;       
      --success-hover: #15803d;
      --danger: #dc2626;        
      --danger-hover: #b91c1c;
      --text-main: #0f172a;     
      --text-sub: #475569;      
      --border-color: #e2e8f0;  
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* บังคับล็อกหน้าจอไม่ให้สกรอลล์ไหลในทุกอุปกรณ์ */
    }

    /* Universal Responsive Fullscreen Container */
    .container {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      background: var(--bg-color);
      
      /* ใช้ Dynamic Padding รองรับหน้าจอมือถือและรอยบาก (Notch) */
      padding: clamp(1rem, 3vh, 2.5rem) clamp(1rem, 4vw, 4rem);
      padding-top: calc(clamp(1rem, 3vh, 2.5rem) + env(safe-area-inset-top));
      padding-bottom: calc(clamp(1rem, 3vh, 1.5rem) + env(safe-area-inset-bottom));
      
      display: flex;
      flex-direction: column;
      justify-content: space-between; 
      position: relative;
    }

    /* Top Section - Banner */
    #save-zone {
      min-height: clamp(50px, 7vh, 75px);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .header-info { 
      width: 100%;
    }
    
    .version-tag { 
      font-size: clamp(0.7rem, 1.5vw, 0.85rem); 
      color: var(--text-sub); 
      font-weight: 700; 
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }

    #team-info-display {
      margin-top: clamp(8px, 1.5vh, 15px); 
      padding: clamp(12px, 2vh, 20px);
      border-radius: 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    #display-team-name { 
      font-size: clamp(1.2rem, 4vw, 2rem); /* ยืดหยุ่นตามความกว้างจอ */
      font-weight: 700; 
      color: var(--text-main); 
      line-height: 1.3; 
      margin-top: 6px; 
    }
    
    #display-key { 
      font-size: clamp(0.8rem, 2vw, 1rem); 
      font-weight: 700; 
      color: var(--primary); 
      display: inline-block; 
      padding: 4px clamp(12px, 2vw, 20px); 
      border-radius: 9999px;
      background-color: #e0f2fe;
    }

    /* Center Section - Responsive Fluid Timer */
    .timer-center-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1; 
      min-height: 0; /* ป้องกัน Flexbox ดันทะลุจอ */
      margin: clamp(0.5rem, 2vh, 1.5rem) 0;
    }

    .btn-setting { 
      color: var(--text-sub);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 18px; 
      border-radius: 9999px; 
      font-size: clamp(0.8rem, 2vw, 1rem);
      cursor: pointer; 
      margin-bottom: clamp(0.5rem, 1.5vh, 1rem);
      font-family: 'Prompt'; 
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn-setting:hover { background-color: #e2e8f0; }

    .timer-display {
      /* ปรับตัวเลขขั้นต่ำเป็น 4.5rem บนมือถือ และขยายได้ถึง 16rem บน iPad/PC */
      font-size: clamp(4.5rem, 21vw, 16rem); 
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-main);
      line-height: 0.9;
      letter-spacing: -2px;
      margin-bottom: clamp(0.8rem, 2vh, 1.5rem);
      text-align: center;
      width: 100%;
    }
    
    .timer-display.counting { color: var(--primary); }
    .timer-display.warning-active {
      color: var(--danger);
      animation: pulseText 1s infinite;
    }

    @keyframes pulseText {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    /* Progress Bar */
    .progress-container {
      width: 100%; 
      height: clamp(10px, 1.8vh, 18px); 
      border-radius: 9999px; 
      overflow: hidden; 
      background-color: #e2e8f0;
    }

    /* 🟢 แก้ไขตรงนี้: เอา transition: width 0.1s linear; ออกเพื่อให้แถบวิ่งตามเวลาจริงได้ทันที */
    #progress-bar { 
      width: 0%; 
      height: 100%; 
      background: var(--primary);
      border-radius: 9999px;
    }
    #progress-bar.warning-active { background: var(--danger); }

    /* Bottom Section */
    .bottom-controls-wrapper {
      width: 100%;
    }

    /* Fluid Action Buttons */
    .neu-action-btn {
      width: 100%; 
      padding: clamp(1.1rem, 2.5vh, 1.8rem); 
      font-size: clamp(1.6rem, 5vw, 2.6rem); 
      font-weight: 800; 
      border-radius: 20px;
      cursor: pointer; 
      font-family: 'Prompt'; 
      letter-spacing: 1px;
      border: none;
      transition: all 0.15s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .neu-action-btn:active { transform: scale(0.99); }

    .neu-action-btn.text-primary { background-color: var(--primary); color: #ffffff !important; }
    .neu-action-btn.text-primary:hover { background-color: var(--primary-hover); }
    
    .neu-action-btn.text-warning { background-color: var(--warning); color: #ffffff !important; }
    .neu-action-btn.text-warning:hover { background-color: var(--warning-hover); }
    
    .neu-action-btn.text-sub { background-color: #cbd5e1; color: var(--text-sub) !important; }

    .neu-action-btn:disabled, button:disabled {
      opacity: 0.6 !important;
      cursor: not-allowed !important;
      background-color: #cbd5e1 !important;
      color: #94a3b8 !important;
    }

    /* ปุ่มเซฟผล */
    .btn-save-top {
      width: 100%;
      padding: clamp(0.9rem, 2vh, 1.3rem);
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      background-color: var(--success);
      color: #ffffff;
      border: none;
      font-family: 'Prompt';
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
    }
    .btn-save-top:hover { background-color: var(--success-hover); }

    /* Secondary Grid Button Controls */
    .control-grid-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(12px, 3vw, 25px);
      width: 100%;
      margin-top: clamp(12px, 2.5vh, 25px);
    }

    .btn-bottom-style {
      padding: clamp(0.9rem, 2vh, 1.4rem); 
      border-radius: 16px;
      cursor: pointer; 
      font-family: 'Prompt'; 
      color: var(--text-main);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      font-weight: 600; 
      font-size: clamp(0.9rem, 2.5vw, 1.25rem);
      transition: all 0.2s;
    }
    .btn-bottom-style:hover { background-color: #e2e8f0; }
    
    .btn-bottom-style.text-danger { 
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      color: var(--danger) !important; 
    }
    .btn-bottom-style.text-danger:hover { 
      background-color: var(--danger);
      color: #ffffff !important;
    }

    .footer-credit {
      margin-top: clamp(0.6rem, 2vh, 1.5rem); 
      font-size: clamp(0.75rem, 1.8vw, 0.9rem); 
      color: var(--text-sub);
      letter-spacing: 1px; 
      font-weight: 500;
      text-align: center;
    }
    .footer-credit b { color: var(--primary); font-weight: 700; }

    /* Modals Overlay */
    .modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(15, 23, 42, 0.4); 
      backdrop-filter: blur(10px);
      z-index: 1000; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
    }

    .modal-content { 
      background-color: #ffffff;
      padding: clamp(1.5rem, 4vh, 3rem); 
      border-radius: 24px;
      width: 100%; 
      max-width: 500px; 
      text-align: left;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
    }

    .modal-content h3 {
      margin-top: 0; 
      color: var(--text-main); 
      padding-bottom: 15px; 
      font-weight: 700;
      text-align: center;
      font-size: clamp(1.3rem, 4vw, 1.6rem);
      border-bottom: 1px solid var(--border-color);
    }

    .setting-group label {
      display: block; 
      font-size: 1rem; 
      color: var(--text-sub); 
      margin-bottom: 8px; 
      font-weight: 600;
    }

    .setting-group input {
      width: 100%; 
      padding: 14px 16px; 
      border-radius: 12px; 
      font-size: 1rem; 
      outline: none;
      color: var(--text-main); 
      font-family: 'Prompt';
      margin-top: 5px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }

    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 60px; height: 32px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { 
      position: absolute; cursor: pointer; inset: 0; 
      border-radius: 9999px; transition: .3s;
      background-color: #cbd5e1;
    }
    .slider:before { 
      position: absolute; content: ""; height: 24px; width: 24px; 
      left: 4px; bottom: 4px; background-color: #ffffff; 
      transition: .3s; border-radius: 50%; 
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(28px); }

    /* History List */
    .history-item { 
      border-radius: 14px; 
      margin-bottom: 10px; 
      padding: 15px !important; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
    }
    #history-list::-webkit-scrollbar { width: 0; display: none; }

    .lottie-loading-wrapper {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .loading-cute-text {
      font-family: 'Prompt'; font-size: 1.1rem; color: var(--text-main);
      font-weight: 600; margin-top: 5px; text-align: center;
      min-height: 28px; transition: opacity 0.3s ease;
    }

    /* SweetAlert Mobile/Tablet Overrides */
    div:where(.swal2-container) div:where(.swal2-popup) {
      background: #ffffff !important;
      border-radius: 24px !important;
      padding: 2rem 1.5rem !important;
      width: 90% !important;
      max-width: 450px !important;
    }
    div:where(.swal2-container) button:where(.swal2-styled) {
      padding: 14px 32px !important;
      border-radius: 14px !important;
      font-family: 'Prompt' !important;
      font-weight: 600 !important;
      font-size: 1.1rem !important;
    }

    /* Container จัดบาลานซ์ไอคอน */
.icon-loader-wrapper {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 20px auto;
}

/* ตัวหมุนพรีเมียม SVG */
.premium-svg-spinner {
  animation: svg-rotate 2s linear infinite;
  width: 100%;
  height: 100%;
}

.premium-svg-spinner circle {
  stroke: var(--primary);
  stroke-linecap: round;
  animation: svg-dash 1.5s ease-in-out infinite;
}

@keyframes svg-rotate {
  100% { transform: rotate(360deg); }
}

@keyframes svg-dash {
  0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
  50% { stroke-dasharray: 89, 200; stroke-dashoffset: -35px; }
  100% { stroke-dasharray: 89, 200; stroke-dashoffset: -124px; }
}
  </style>
</head>
<body>

<div class="container">
  <!-- Top: Zone Save & Header Team -->
  <div id="save-zone"></div>
  
  <div class="header-info">
    <div class="version-tag">WRO 2026 OFFICIAL TIMER | V.3.1.5</div>
    
    <div id="team-info-display">
      <div id="display-key">CHECKING ID</div>
      <div id="display-team-name">กำลังโหลดข้อมูล...</div>
      <div id="display-institution" style="font-size: clamp(0.85rem, 2.2vw, 1.05rem); color: var(--text-sub); margin-top: 4px; font-weight: 500;">PLEASE WAIT</div>
    </div>
  </div>
  
  <!-- Center: Fluid Timer & Progress -->
  <div class="timer-center-wrapper">
    <button class="btn-setting" id="settingBtn" onclick="openSettings()">LIMIT: 120.00s ⚙️</button>
    <div class="timer-display" id="display">0.00</div>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>
  
  <!-- Bottom: Controllers & Footer -->
  <div class="bottom-controls-wrapper">
    <div id="action-controller">
      <button id="actionBtn" class="neu-action-btn text-primary" onclick="handleAction()">START</button>
    </div>
    
    <div class="control-grid-bottom">
      <button class="btn-bottom-style" onclick="showHistory()">HISTORY 📋</button>
      <button class="btn-bottom-style text-danger" onclick="confirmReset()">RESET 🔄</button>
    </div>
    
    <div class="footer-credit">CREATE BY <b>GOZAMA</b></div>
  </div>
</div>

  <!-- Settings Modal -->
  <div id="settingModal" class="modal">
    <div class="modal-content">
      <h3>ตั้งค่านาฬิกา</h3>
      
      <div class="setting-group" style="margin-top: 20px;">
        <label>เวลาแข่งขัน (วินาที)</label>
        <input type="number" id="setLimit" value="120">
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin: 25px 0;">
        <span style="font-size: 1rem; font-weight:600; color: var(--text-main);">นับถอยหลังก่อนเริ่ม (3 วินาที)</span>
        <label class="switch">
          <input type="checkbox" id="setCountdown">
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="setting-group">
        <label>เตือนช่วงท้าย (วินาทีที่เหลือ)</label>
        <input type="number" id="setWarnAt" value="10">
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin: 25px 0;">
        <span style="font-size: 1rem; font-weight:600; color: var(--text-main);">เสียงเตือนล่วงหน้า</span>
        <label class="switch">
          <input type="checkbox" id="setWarning" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <button style="width:100%; margin-top:20px; padding:14px; font-size: 1.1rem; border-radius: 14px; background-color: var(--primary); color:white; border:none; font-family: 'Prompt'; font-weight:700; cursor:pointer;" onclick="saveSettings()">บันทึกการตั้งค่า</button>
      <button style="width: 100%; margin-top: 10px; padding:12px; border-radius: 14px; background-color: #f1f5f9; border:none; font-family: 'Prompt'; color: var(--text-sub); font-weight:600; cursor:pointer;" onclick="document.getElementById('settingModal').style.display='none'">ยกเลิก</button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content">
      <h3>ประวัติการบันทึก (เครื่องนี้)</h3>
      <div id="history-list" style="max-height: 42vh; overflow-y: auto; padding-right: 5px; padding-top: 10px;"></div>
      <button style="width: 100%; margin-top: 25px; padding:14px; border-radius: 14px; background-color: #f1f5f9; border:none; font-family: 'Prompt'; color: var(--text-sub); cursor:pointer; font-weight: 600;" onclick="document.getElementById('history-modal').style.display='none'">ปิดหน้าต่าง</button>
    </div>
  </div>

  <!-- Logic Scripts -->
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw-5W0x3pSIlwE-vCUNOai_mJzQaEZ3gRLhsddK67Dwv3qVWO6qK-qu7U2CGWMUCRe-sQ/exec"; 
    let globalRowKey = ""; 
    let CONFIG = {
      limit: parseFloat(localStorage.getItem('cfg_limit')) || 120,
      useCountdown: localStorage.getItem('cfg_useCountdown') === 'true',
      useWarning: localStorage.getItem('cfg_useWarning') !== 'false',
      warnAt: parseFloat(localStorage.getItem('cfg_warnAt')) || 10
    };
    
    let state = "IDLE"; 
    let startTime, elapsedTime = 0, timerInterval = null, countdownInt = null;
    let lastBeepSecond = -1;
    let textRotationInterval = null;

    let myDeviceID = localStorage.getItem('timer_device_id');
    if (!myDeviceID) {
      myDeviceID = 'DEV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
      localStorage.setItem('timer_device_id', myDeviceID);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 880, dur = 0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine"; 
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch (e) { console.error("Audio error:", e); }
    }

    function unlockIOSAudio() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer; source.connect(audioCtx.destination);
      source.start(0);
    }

    function setControlsEnabled(enabled) {
      document.getElementById('settingBtn').disabled = !enabled;
    }

    function directClose() {
      window.open('', '_self', ''); window.close(); 
      if (navigator.app && navigator.app.exitApp) navigator.app.exitApp();
      setTimeout(() => {
        const fallbackUrl = "https://www.appsheet.com/start/eb97edb9-4301-4845-8912-94a8601ee51a";
        try { window.top.location.href = fallbackUrl; } catch(e) { window.location.href = fallbackUrl; }
      }, 200);
    }

    const isGoogleEnv = (typeof google !== 'undefined' && google.script && google.script.run);

    function callBackend(action, params, callback) {
      if (isGoogleEnv) {
        if (action === 'getTeamInfo') {
          google.script.run.withSuccessHandler(callback).getTeamInfo(params.rowKey);
        } else if (action === 'saveTime') {
          google.script.run.withSuccessHandler(callback).saveTime(params.timeStr, params.deviceID, params.rowKey);
        } else if (action === 'getHistory') {
          google.script.run.withSuccessHandler(callback).getHistory(params.deviceID);
        }
      } else {
        let url = `${GAS_WEB_APP_URL}?action=${action}`;
        for (let key in params) { url += `&${key}=${encodeURIComponent(params[key])}`; }
        fetch(url)
          .then(res => res.json())
          .then(data => callback(data))
          .catch(err => {
            console.error("API Error:", err);
            Swal.fire('Error', 'การเชื่อมต่อฐานข้อมูลล้มเหลว', 'error');
            if(action === 'getTeamInfo') callback(null);
          });
      }
    }

    function getURLParameters(callback) {
      if (isGoogleEnv) {
        google.script.url.getLocation(function(location) {
          let key = location.parameter.rowKey || (location.parameters && location.parameters.rowKey ? location.parameters.rowKey[0] : "");
          callback(key);
        });
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        callback(urlParams.get('rowKey') || "");
      }
    }

    function renderButtonUI() {
      const mainController = document.getElementById('action-controller');
      const saveZone = document.getElementById('save-zone');
      
      if (state === "IDLE") {
        mainController.innerHTML = `<button id="actionBtn" class="neu-action-btn text-primary" onclick="handleAction()">START</button>`;
        saveZone.innerHTML = "";
      } 
      else if (state === "COUNTING") {
        mainController.innerHTML = `<button id="actionBtn" class="neu-action-btn text-sub" style="opacity: 0.5; cursor: not-allowed;" disabled>COUNTDOWN</button>`;
        saveZone.innerHTML = "";
      } 
      else if (state === "RUNNING") {
        mainController.innerHTML = `<button id="actionBtn" class="neu-action-btn text-warning" onclick="pauseRunning()">PAUSE / STOP</button>`;
        saveZone.innerHTML = "";
      } 
      else if (state === "PAUSED") {
        mainController.innerHTML = `<button id="actionBtn" class="neu-action-btn text-primary" onclick="resumeRunning()">RESUME</button>`;
        saveZone.innerHTML = `<button class="btn-save-top" onclick="confirmSave()">SAVE RESULT</button>`;
      } 
      else if (state === "FINISHED") {
        mainController.innerHTML = `<button id="actionBtn" class="neu-action-btn" style="opacity: 0.4; cursor:not-allowed;" disabled>TIME OVER</button>`;
        saveZone.innerHTML = `<button class="btn-save-top" onclick="confirmSave()">SAVE RESULT</button>`;
      }
    }

    function handleAction() {
      if (state === "IDLE") {
        unlockIOSAudio();
        if (CONFIG.useCountdown) {
          startCountdown();
        } else {
          startRunning();
        }
      }
    }

    function startCountdown() {
      state = "COUNTING";
      renderButtonUI();
      setControlsEnabled(false);
      
      const display = document.getElementById('display');
      display.classList.add('counting');
      
      let lastTriggeredSecond = -1;
      const countdownDuration = 3000;
      const countdownStart = Date.now();

      countdownInt = setInterval(() => {
        const timePassed = Date.now() - countdownStart;
        const timeLeft = countdownDuration - timePassed;
        const currentCount = Math.ceil(timeLeft / 1000);

        if (timeLeft > 0) {
          if (currentCount !== lastTriggeredSecond) {
            display.innerText = currentCount;
            playBeep(440, 0.1);
            lastTriggeredSecond = currentCount;
          }
        } else {
          clearInterval(countdownInt);
          countdownInt = null;
          display.classList.remove('counting');
          playBeep(880, 0.3);
          startRunning();
        }
      }, 16);

      display.innerText = "3";
      playBeep(440, 0.1);
      lastTriggeredSecond = 3;
    }

    function startRunning() {
      state = "RUNNING";
      renderButtonUI();
      setControlsEnabled(false);
      startTime = Date.now() - elapsedTime;
      timerInterval = setInterval(update, 10);
    }

    function pauseRunning() {
      if (state === "RUNNING") {
        clearInterval(timerInterval);
        timerInterval = null;
        state = "PAUSED";
        setControlsEnabled(true);
        renderButtonUI();
        displayTime(elapsedTime);
      }
    }

    function resumeRunning() {
      if (state === "PAUSED") {
        state = "RUNNING";
        renderButtonUI();
        setControlsEnabled(false);
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(update, 10);
      }
    }

    function update() {
      const now = Date.now();
      elapsedTime = now - startTime;
      const limitMs = CONFIG.limit * 1000;
      
      if (elapsedTime >= limitMs) { 
        elapsedTime = limitMs; 
        clearInterval(timerInterval);
        timerInterval = null;
        state = "FINISHED";
        renderButtonUI();
        setControlsEnabled(true);
        playBeep(440, 0.5); 
        displayTime(elapsedTime);
        return;
      }
      
      const currentSec = Math.floor(elapsedTime / 1000);
      const remainSec = CONFIG.limit - currentSec;
      const display = document.getElementById('display');
      const progressBar = document.getElementById('progress-bar');
      
      if (CONFIG.useWarning && remainSec <= CONFIG.warnAt && state === "RUNNING") {
        display.classList.add('warning-active');
        progressBar.classList.add('warning-active');
        if (currentSec !== lastBeepSecond && elapsedTime < limitMs) {
          playBeep(880, 0.1);
          lastBeepSecond = currentSec;
        }
      } else {
        display.classList.remove('warning-active');
        progressBar.classList.remove('warning-active');
      }
      displayTime(elapsedTime);
    }

    function displayTime(ms) {
      document.getElementById('display').innerText = (ms / 1000).toFixed(2);
      const percentage = (ms / (CONFIG.limit * 1000)) * 100;
      document.getElementById('progress-bar').style.width = Math.min(percentage, 100) + "%";
    }

    function reset() {
      if (timerInterval) clearInterval(timerInterval);
      if (countdownInt) clearInterval(countdownInt);
      timerInterval = null;
      countdownInt = null;
      
      state = "IDLE";
      elapsedTime = 0;
      lastBeepSecond = -1;
      
      setControlsEnabled(true);
      renderButtonUI();
      displayTime(0);
      
      document.getElementById('display').classList.remove('warning-active', 'counting');
      document.getElementById('progress-bar').classList.remove('warning-active');
    }

    function confirmSave() {
      const timeStr = (elapsedTime / 1000).toFixed(2);
      Swal.fire({
        title: 'บันทึกเวลาแข่งขัน?',
        text: `เวลา: ${timeStr} วินาที`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ใช่, บันทึกผล',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => { if (result.isConfirmed) saveToSheet(timeStr); });
    }

    function saveToSheet(timeStr) {
  if (!globalRowKey) { 
    Swal.fire('Error', 'ไม่พบข้อมูล ID ทีมใน URL ลิงก์', 'error');
    return; 
  }
  
  const loadingTexts = [
    "กำลังส่งนะ รอหน่อยนะ...",
    "เน็ตอาจจะช้านิดนึง...",
    "รอน่าจะไม่เกิน 10 วินาที หรอกมั้ง...",
    "กำลังเซฟลง Google Sheets...",
    "เซฟเสร็จละ ก็บอกแล้วแปบเดียว..."
  ];
  
  Swal.fire({
  html: `
    <div class="lottie-loading-wrapper">
      <!-- 🟢 ไอคอน SVG ดีไซน์พรีเมียม (0 KB ไม่โหลดไฟล์นอก) -->
      <div class="icon-loader-wrapper">
        <svg class="premium-svg-spinner" viewBox="25 25 50 50">
          <circle cx="50" cy="50" r="20" fill="none" stroke-width="5" stroke-miterlimit="10"/>
        </svg>
      </div>
      <div id="cute-loading-msg" class="loading-cute-text">${loadingTexts[0]}</div>
    </div>
  `,
  showConfirmButton: false,
  allowOutsideClick: false,
  allowEscapeKey: false,
  didOpen: () => {
      let textIdx = 1;
      textRotationInterval = setInterval(() => {
        const textEl = document.getElementById('cute-loading-msg');
        if (textEl) {
          textEl.style.opacity = 0;
          setTimeout(() => {
            textEl.innerText = loadingTexts[textIdx % loadingTexts.length];
            textEl.style.opacity = 1;
            textIdx++;
          }, 150);
        }
      }, 1600);
    },
    willClose: () => {
      if (textRotationInterval) clearInterval(textRotationInterval);
    }
  });
  
  callBackend('saveTime', { timeStr: timeStr, deviceID: myDeviceID, rowKey: globalRowKey }, function(res) {
    // 🟢 ลบ Swal.close(); ตรงนี้ออกไปแล้ว เพื่อให้กล่องด้านล่างนี้แสดงทับกล่องโหลดได้ทันที
    if(res && res.success) {
      Swal.fire({ 
        icon: 'success',
        title: 'บันทึกแล้วจ้า!',
        text: `ผลการจับเวลา ${timeStr} วินาที เรียบร้อย`,
        allowOutsideClick: false,
        allowEscapeKey: false,
        confirmButtonText: '❌ ปิดหน้าจอ'
      }).then((result) => { if (result.isConfirmed) { directClose(); } });
    } else {
      Swal.fire('เกิดข้อผิดพลาด', res ? res.error : 'ไม่สามารถส่งข้อมูลได้', 'error');
    }
  });
}

    function confirmReset() {
      Swal.fire({ 
        title: 'Reset เวลา?', 
        text: 'กระบวนการนี้จะล้างเวลาปัจจุบันทิ้งทั้งหมด', 
        icon: 'warning', 
        showCancelButton: true, 
        confirmButtonText: 'ใช่, รีเซ็ต',
        cancelButtonText: 'ยกเลิก'
      })
      .then((result) => { if (result.isConfirmed) reset(); });
    }

    // Modal Operations
    function openSettings() { 
      document.getElementById('setLimit').value = CONFIG.limit;
      document.getElementById('setCountdown').checked = CONFIG.useCountdown;
      document.getElementById('setWarning').checked = CONFIG.useWarning;
      document.getElementById('setWarnAt').value = CONFIG.warnAt;
      document.getElementById('settingModal').style.display = 'flex'; 
    }
    
    function saveSettings() {
      CONFIG.limit = parseFloat(document.getElementById('setLimit').value) || 120;
      CONFIG.useCountdown = document.getElementById('setCountdown').checked;
      CONFIG.useWarning = document.getElementById('setWarning').checked;
      CONFIG.warnAt = parseFloat(document.getElementById('setWarnAt').value) || 10;
      
      localStorage.setItem('cfg_limit', CONFIG.limit);
      localStorage.setItem('cfg_useCountdown', CONFIG.useCountdown);
      localStorage.setItem('cfg_useWarning', CONFIG.useWarning);
      localStorage.setItem('cfg_warnAt', CONFIG.warnAt);

      document.getElementById('settingBtn').innerText = `LIMIT: ${CONFIG.limit.toFixed(2)}s ⚙️`;
      document.getElementById('settingModal').style.display = 'none';
      reset();
    }

    function showHistory() {
      document.getElementById('history-modal').style.display = 'flex';
      loadHistoryData();
    }

    function loadHistoryData() {
      const list = document.getElementById('history-list');
      list.innerHTML = `<div style="padding:20px; opacity:0.5; text-align:center;">กำลังโหลดประวัติ...</div>`;
      
      callBackend('getHistory', { deviceID: myDeviceID }, function(data) {
        if (!data || data.length === 0) {
          list.innerHTML = `<div style="padding:20px; opacity:0.5; text-align:center;">ไม่มีประวัติการบันทึกของเครื่องนี้</div>`;
          return;
        }
        list.innerHTML = data.map(item => `
          <div class="history-item">
            <div style="text-align:left">
              <div style="font-size:1rem; color:var(--text-sub); font-weight:600;">
                ${item.date} | <span style="color:var(--primary); font-weight:bold;">ID: ${item.team}</span>
              </div>
            </div>
            <b style="font-size:1.3rem; align-self:center; color:var(--text-main)">${item.time}s</b>
          </div>
        `).join('');
      });
    }

    function loadTeamInfo(rowKey) {
  callBackend('getTeamInfo', { rowKey: rowKey }, function(info) {
    if (info) {
      // 🟢 เปลี่ยนจาก info.key เป็น info.teamIdDisplay เพื่อเอาข้อมูลจาก Col F มาแสดง
      document.getElementById('display-key').innerText = "TEAM ID: " + (info.teamIdDisplay || "-");
      document.getElementById('display-team-name').innerText = info.teamName || "ไม่พบชื่อทีม";
      document.getElementById('display-institution').innerText = info.institution || "-";
    } else {
      document.getElementById('display-team-name').innerText = "ไม่พบ ID นี้ในระบบ";
      document.getElementById('display-institution').innerText = "โปรดตรวจสอบฐานข้อมูลชีต";
      document.getElementById('display-key').innerText = "ID: " + rowKey;
    }
  });
}

    window.onload = function() {
      document.getElementById('settingBtn').innerText = `LIMIT: ${CONFIG.limit.toFixed(2)}s ⚙️`;
      
      document.addEventListener('touchstart', unlockIOSAudio, { once: true });
      document.addEventListener('click', unlockIOSAudio, { once: true });

      getURLParameters(function(rowKey) {
        globalRowKey = rowKey;
        if (globalRowKey) {
          loadTeamInfo(globalRowKey);
        } else {
          document.getElementById('display-team-name').innerText = "LAP TIMER PRO";
          document.getElementById('display-institution').innerText = "READY TO START (NO PARAMETER)";
          document.getElementById('display-key').innerText = "NO ID DETECTED";
        }
      });
    };
  </script>
</body>
</html>
